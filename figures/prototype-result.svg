  <text class="sans row" x="32" y="464">Always xhigh</text>
  <circle cx="338.4" cy="459" r="6" fill="#191F1D"/>
  <text class="sans valk" x="348.4" y="454" text-anchor="start">69.8%</text>
  <text class="sans num" x="522" y="464" text-anchor="end">1.00x</text>
  <text class="sans num" x="586" y="464" text-anchor="end">1.00x</text>
  <text class="sans num" x="648" y="464" text-anchor="end">100%</text>
  <line x1="240" y1="489" x2="440" y2="489" stroke="#D3DBD7" stroke-width="1"/>
