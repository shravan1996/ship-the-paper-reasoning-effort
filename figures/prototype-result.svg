  <line x1="240" y1="429" x2="440" y2="429" stroke="#D3DBD7" stroke-width="1"/>
  <text class="sans row" x="32" y="434">Always low</text>
  <circle cx="278.6" cy="429" r="6" fill="#191F1D"/>
  <text class="sans valk" x="268.6" y="424" text-anchor="end">63.9%</text>
  <text class="sans num" x="522" y="434" text-anchor="end">0.35x</text>
  <text class="sans num" x="586" y="434" text-anchor="end">0.32x</text>
  <text class="sans num" x="648" y="434" text-anchor="end">0%</text>
