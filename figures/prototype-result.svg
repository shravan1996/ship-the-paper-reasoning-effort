  <text class="sans foot" x="32" y="636">CLI: the Claude Code CLI's list-price figure, the pre-registered measure.</text>
  <text class="sans foot" x="32" y="656">API: the same calls priced without the CLI's own tokens. Amber: real checks.</text>
