<svg xmlns="http://www.w3.org/2000/svg" width="680" height="670" viewBox="0 0 680 670" role="img" aria-labelledby="title desc">
  <title id="title">What each ladder bought</title>
  <desc id="desc">Five policies compared on BBEH questions. Claude Sonnet 5.5, 368 questions: always low, 68.2 percent correct, 0.44 times the cost of always xhigh at the CLI's price and 0.35 times without the CLI's overhead, 0 percent sent to xhigh; always xhigh, 75.8 percent correct, 1.00 times the cost of always xhigh at the CLI's price and 1.00 times without the CLI's overhead, 100 percent sent to xhigh; ladder, gold answer, 77.4 percent correct, 0.88 times the cost of always xhigh at the CLI's price and 0.78 times without the CLI's overhead, 32 percent sent to xhigh; ladder, two lows agree, 73.1 percent correct, 1.11 times the cost of always xhigh at the CLI's price and 0.98 times without the CLI's overhead, 17 percent sent to xhigh; ladder, self-check, 73.4 percent correct, 1.12 times the cost of always xhigh at the CLI's price and 0.91 times without the CLI's overhead, 13 percent sent to xhigh. Claude Haiku 5.5, 368 questions: always low, 63.9 percent correct, 0.35 times the cost of always xhigh at the CLI's price and 0.32 times without the CLI's overhead, 0 percent sent to xhigh; always xhigh, 69.8 percent correct, 1.00 times the cost of always xhigh at the CLI's price and 1.00 times without the CLI's overhead, 100 percent sent to xhigh; ladder, gold answer, 75.3 percent correct, 0.73 times the cost of always xhigh at the CLI's price and 0.70 times without the CLI's overhead, 36 percent sent to xhigh; ladder, two lows agree, 69.8 percent correct, 1.07 times the cost of always xhigh at the CLI's price and 1.03 times without the CLI's overhead, 28 percent sent to xhigh; ladder, self-check, 70.1 percent correct, 1.00 times the cost of always xhigh at the CLI's price and 0.93 times without the CLI's overhead, 23 percent sent to xhigh.</desc>
  <style>
    text { stroke: none; }
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    .sans  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { font-size: 26px; font-weight: 600; fill: #191F1D; }
    .sub { font-size: 14.5px; fill: #3F4945; }
    .label { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; fill: #5C6964; }
    .colhead { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; fill: #5C6964; }
    .row { font-size: 14.5px; fill: #191F1D; }
    .val { font-size: 13px; font-weight: 700; fill: #1F6B4C; }
    .valk { font-size: 13px; font-weight: 700; fill: #191F1D; }
    .valw { font-size: 13px; font-weight: 700; fill: #8F6019; }
    .num { font-size: 14px; fill: #3F4945; }
    .numw { font-size: 14px; font-weight: 700; fill: #8F6019; }
    .tick { font-size: 12px; fill: #5C6964; }
    .foot { font-size: 13.5px; fill: #3F4945; }
  </style>
  <text class="serif h1" x="32" y="44">What each ladder bought</text>
  <text class="sans sub" x="32" y="72">Accuracy on BBEH questions, and mean cost per question as a</text>
  <text class="sans sub" x="32" y="92">multiple of always running xhigh. Dashed line: always xhigh.</text>
  <line x1="32" y1="110" x2="648" y2="110" stroke="#D3DBD7" stroke-width="1"/>
  <text class="sans colhead" x="340" y="140" text-anchor="middle">ACCURACY</text>
  <text class="sans colhead" x="522" y="132" text-anchor="end">COST,</text>
  <text class="sans colhead" x="522" y="146" text-anchor="end">CLI</text>
  <text class="sans colhead" x="586" y="132" text-anchor="end">COST,</text>
  <text class="sans colhead" x="586" y="146" text-anchor="end">API</text>
  <text class="sans colhead" x="648" y="132" text-anchor="end">TO</text>
  <text class="sans colhead" x="648" y="146" text-anchor="end">XHIGH</text>
